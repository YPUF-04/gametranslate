# SPDX-License-Identifier: AGPL-3.0-only
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altyazikoprusu"
version = "0.1.6"
description = "Oyun ekranındaki yazıyı canlı çevirip TV uygulamalarına yayınlar."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "aiohttp>=3.9",
  "anthropic>=0.40",
  "keyring>=24",
  "platformdirs>=4",
  "pillow>=10",
  "mss>=9",
  "ctranslate2>=4.0",
  "sentencepiece>=0.2",
]

[project.optional-dependencies]
ocr-windows = ["winocr"]
ocr-mac = ["ocrmac"]
ocr = ["rapidocr_onnxruntime"]
yerel = ["ctranslate2>=4.0", "sentencepiece>=0.2"]   # uyumluluk: artık çekirdek bağımlılık
ses = ["faster-whisper", "soundcard", "numpy"]
# Türkçe dublaj (deneysel, PROTOKOL 9). pycaw yalnız Windows'ta (oyun sesini uygulama bazında kısmak için).
dublaj = [
  "chatterbox-tts",
  "pocket-tts",
  "faster-whisper",
  "numpy",
  "soundcard",
  "sounddevice",
  "pycaw; sys_platform == 'win32'",
  "psutil; sys_platform == 'win32'",
]
dublaj-kalite = ["librosa"]   # isteğe bağlı: sesi hızlandırırken daha iyi kalite (yoksa numpy WSOLA kullanılır)
tv = ["paramiko>=3.4,<4"]   # TV'ye tek tuşla kurulum (LG webOS)
test = ["pytest", "pytest-aiohttp", "pytest-asyncio", "cryptography>=42", "numpy"]
# Yalnız geliştiricinin kod üretme aracı için (uygulama bunu kullanmaz)
kod = ["cryptography>=42"]

[project.scripts]
altyazikoprusu = "kopru.__main__:main"

[tool.setuptools.packages.find]
include = ["kopru*"]

[tool.setuptools.package-data]
kopru = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
