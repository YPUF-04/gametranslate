<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>AltYazıKöprüsü</title>
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hdmi"></div>
<div id="kok"></div>

<section id="e-ara" class="ekran">
  <h1 data-i="ara_baslik"></h1>
  <p id="ara-durum" class="yardim"></p>
  <div id="ara-liste" class="liste"></div>
  <p id="ara-hata" class="hata"></p>
  <div class="satir">
    <button class="dugme" id="b-yeniden" data-i="yeniden"></button>
    <button class="dugme" id="b-elle" data-i="elle"></button>
    <button class="dugme" id="b-deneme" data-i="deneme"></button>
  </div>
</section>

<section id="e-hdmi" class="ekran">
  <h1 data-i="hdmi_baslik"></h1>
  <p class="yardim" data-i="hdmi_ipucu"></p>
  <div class="satir">
    <button class="dugme buyuk" data-hdmi="1">HDMI 1</button>
    <button class="dugme buyuk" data-hdmi="2">HDMI 2</button>
    <button class="dugme buyuk" data-hdmi="3">HDMI 3</button>
    <button class="dugme buyuk" data-hdmi="4">HDMI 4</button>
  </div>
  <p id="hdmi-hata" class="hata"></p>
  <div class="satir"><button class="dugme" id="b-hdmi-geri" data-i="geri"></button></div>
</section>

<section id="e-elle" class="ekran">
  <h1 data-i="elle_baslik"></h1>
  <p class="yardim" data-i="elle_ipucu"></p>
  <div id="adres-alan" class="adres-alan"></div>
  <div class="tus-izgara" id="tus-izgara"></div>
  <p id="elle-hata" class="hata"></p>
  <div class="satir">
    <button class="dugme" id="b-elle-tamam" data-i="tamam"></button>
    <button class="dugme" id="b-elle-iptal" data-i="iptal"></button>
  </div>
</section>

<section id="e-calis" class="ekran sade">
  <div id="calis-ipucu" class="ipucu"></div>
  <div id="calis-hata" class="hata buyuk-hata"></div>
  <div id="demo-not" class="ipucu"></div>
</section>

<section id="panel" class="ekran">
  <h1 data-i="panel_baslik"></h1>
  <table class="bilgi">
    <tr><th data-i="p_bilgisayar"></th><td id="p-pc"></td></tr>
    <tr><th data-i="p_baglanti"></th><td id="p-baglanti"></td></tr>
    <tr><th data-i="p_ceviri"></th><td id="p-ceviri"></td></tr>
    <tr><th data-i="p_son"></th><td id="p-son"></td></tr>
    <tr><th data-i="p_hdmi"></th><td id="p-hdmi"></td></tr>
    <tr><th data-i="p_surum"></th><td id="p-surum"></td></tr>
  </table>
  <div class="satir">
    <button class="dugme" id="b-p-kapat" data-i="kapat"></button>
    <button class="dugme" id="b-p-hdmi" data-i="hdmi_degistir"></button>
    <button class="dugme" id="b-p-pc" data-i="pc_degistir"></button>
  </div>
</section>

<script src="i18n.js"></script>
<script src="platform-webos.js"></script>
<script src="ortak.js"></script>
<script src="app.js"></script>
</body>
</html>
