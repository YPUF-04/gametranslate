<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>AltYazıKöprüsü</title>
<style id="ak-yukleyici-stil">
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0A1424; color: #F3F6FA;
  font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
#ak-bekle { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: -webkit-box; display: flex;
  -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; -webkit-box-orient: vertical; flex-direction: column;
  background: linear-gradient(180deg, #0E1A2E 0%, #08111F 100%); }
#ak-bekle .ad { font-size: 54px; font-weight: 700; letter-spacing: -0.5px; margin-top: 36px; }
#ak-bekle .alt { font-size: 32px; color: #B4C3D7; margin-top: 18px; min-height: 44px; }
#ak-bekle .yay { width: 52px; height: 52px; box-sizing: border-box; border-radius: 50%; margin-top: 44px;
  border: 6px solid rgba(46, 196, 182, 0.22); border-top-color: #2EC4B6; -webkit-animation: akd 0.9s linear infinite; animation: akd 0.9s linear infinite; }
@-webkit-keyframes akd { to { -webkit-transform: rotate(360deg); } }
@keyframes akd { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="ak-bekle">
  <svg width="128" height="128" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="16" fill="#132745"/>
    <path d="M8 33 A30 30 0 0 1 56 33" fill="none" stroke="#2EC4B6" stroke-width="5" stroke-linecap="round"/>
    <rect x="10" y="37" width="44" height="11" rx="5.5" fill="#FFD166"/>
    <rect x="17" y="41" width="17" height="3" rx="1.5" fill="#0C1729" opacity=".72"/>
    <rect x="37" y="41" width="10" height="3" rx="1.5" fill="#0C1729" opacity=".72"/>
  </svg>
  <div class="ad">AltYazıKöprüsü</div>
  <div class="alt" id="ak-bekle-alt"></div>
  <div class="yay"></div>
</div>
<script src="gomulu.js"></script>
<script src="yukleyici.js"></script>
</body>
</html>
