# SPDX-License-Identifier: AGPL-3.0-only
# Windows için: testler -> PyInstaller paketi -> Velopack (tam + delta + Setup) -> geçiş kurucusu (Inno) -> SHA256SUMS.txt -> (etikette) GitHub Sürümü.
# Sürüm yayınlamak: pyproject.toml ve kopru/__init__.py içindeki sürümü yükseltin, sonra `git tag v0.2.0 && git push --tags`.
# Hiçbir sunucu kullanılmaz; her şey GitHub Actions ve GitHub Releases üzerindedir.
name: Windows paketi

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Geliştirme dalında da kurucu üretilsin ki gerçekten derlendiği görülsün (yayın yapılmaz).
    branches: ["claude/**"]
    paths: ["paketleme/**", "kopru/**", "uzaktan/**", "pyproject.toml", "requirements*.txt", ".github/workflows/windows-paket.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install -e ".[tv,test]"
      - name: Testleri çalıştır
        run: python -m pytest -q

  # PS5 gizli bağlantı yardımcısı (PROTOKOL §15): libchiaki + FFmpeg, MSYS2 MINGW64 ile statik tek .exe
  uzaktan:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm mingw-w64-x86_64-openssl mingw-w64-x86_64-opus mingw-w64-x86_64-json-c
            mingw-w64-x86_64-miniupnpc mingw-w64-x86_64-libevent mingw-w64-x86_64-python
            mingw-w64-x86_64-python-protobuf mingw-w64-x86_64-protobuf
      - uses: actions/cache@v4
        with:
          path: build/uzaktan-is/ffmpeg-kur
          key: ffmpeg-n7.1.1-h264-hevc-mingw64-v1
      - name: Yardımcıyı derle
        run: bash uzaktan/derle.sh uzaktan-cikti
      - name: Yardımcı çalışıyor mu (yardım + öz denetim)
        run: |
          ./uzaktan-cikti/ayk-uzaktan.exe --help
          ./uzaktan-cikti/ayk-uzaktan.exe surum
          ./uzaktan-cikti/ayk-uzaktan.exe ozdenetim | tee oz.log
          grep -q "OZDENETIM uzaktan=tamam" oz.log
          ls -la uzaktan-cikti
      - uses: actions/upload-artifact@v4
        with:
          name: ayk-uzaktan
          path: uzaktan-cikti/*

  paket:
    needs: [test, uzaktan]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sürümü belirle (pyproject.toml / etiket)
        id: surum
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $s = python paketleme/surum.py $env:GITHUB_REF_NAME } else { $s = python paketleme/surum.py }
          if ($LASTEXITCODE -ne 0) { throw "Sürüm numaraları uyuşmuyor (ayrıntı yukarıda)." }
          "surum=$s" >> $env:GITHUB_OUTPUT
      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller
          pip install -e ".[tv]"
      - uses: actions/download-artifact@v4
        with:
          name: ayk-uzaktan
          path: uzaktan-cikti
      - name: Exe sürüm bilgisini üret
        run: python paketleme/windows/surum_bilgisi.py "${{ steps.surum.outputs.surum }}" paketleme/windows/surum-bilgisi.txt
      - name: Paketle (PyInstaller)
        run: >
          pyinstaller --noconfirm --name AltYaziKoprusu --onedir
          --hide-console hide-early
          --icon paketleme/simge/uygulama.ico
          --version-file paketleme/windows/surum-bilgisi.txt
          --collect-all ctranslate2
          --collect-all sentencepiece
          --add-binary "C:/Windows/System32/msvcp140.dll;."
          --add-binary "C:/Windows/System32/msvcp140_1.dll;."
          --add-binary "C:/Windows/System32/vcruntime140_1.dll;."
          --add-binary "C:/Windows/System32/concrt140.dll;."
          --add-binary "uzaktan-cikti/ayk-uzaktan.exe;uzaktan"
          --add-data "uzaktan-cikti/LICENSE-chiaki-ng.txt;uzaktan"
          --add-data "uzaktan-cikti/LICENSE-FFmpeg-LGPL.txt;uzaktan"
          --paths .
          --add-data "kopru/web;kopru/web"
          --add-data "kopru/__init__.py;kopru"
          --add-data "kopru/ses/__init__.py;kopru/ses"
          --add-data "kopru/dublaj;kopru/dublaj"
          --add-data "tv/paketler;tv/paketler"
          --collect-submodules kopru
          --hidden-import tkinter
          --hidden-import paramiko
          --collect-all winocr
          --collect-all velopack
          --collect-submodules winrt
          --hidden-import keyring.backends.Windows
          paketleme/baslat.py
      - name: sentencepiece.libs DLL'lerini pakete kopyala (PyInstaller bazılarını atlıyor)
        shell: bash
        run: |
          kaynak=$(python -c "import sentencepiece, os; print(os.path.join(os.path.dirname(os.path.dirname(sentencepiece.__file__)), 'sentencepiece.libs'))")
          mkdir -p dist/AltYaziKoprusu/_internal/sentencepiece.libs
          cp -v "$kaynak"/*.dll dist/AltYaziKoprusu/_internal/sentencepiece.libs/
      - name: Pakete giren C++ kütüphaneleri (tanı)
        shell: bash
        run: |
          ls dist/AltYaziKoprusu/_internal | grep -iE "msvcp|vcruntime|concrt|sentencepiece|ctranslate|iomp" || true
          ls -la dist/AltYaziKoprusu/_internal/sentencepiece.libs dist/AltYaziKoprusu/_internal/sentencepiece || true
          pip install pefile >/dev/null
          python -c "
          import pefile, glob, os
          kok = 'dist/AltYaziKoprusu/_internal'
          var = {f.lower() for f in os.listdir(kok)} | {f.lower() for f in os.listdir(kok + '/sentencepiece.libs')}
          for pyd in glob.glob(kok + '/sentencepiece/*.pyd') + glob.glob(kok + '/ctranslate2/*.pyd'):
              pe = pefile.PE(pyd)
              for d in pe.DIRECTORY_ENTRY_IMPORT:
                  ad = d.dll.decode()
                  print(os.path.basename(pyd), '->', ad, 'VAR' if ad.lower() in var else 'YOK')
          " || true
      - name: Paketlenmiş program açılıyor mu (duman testi)
        shell: bash
        run: |
          ./dist/AltYaziKoprusu/AltYaziKoprusu.exe --tarayici-acma > sunucu.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8642/kopru/merhaba && ok=1 && break; sleep 1; done
          cat sunucu.log || true
          taskkill //IM AltYaziKoprusu.exe //F || true
          test "$ok" = 1
      - name: Bilgisayar ekranı katmanı açılıyor mu (Türkçe yazı çizimi)
        shell: bash
        run: |
          ./dist/AltYaziKoprusu/AltYaziKoprusu.exe --katman --url http://127.0.0.1:9/yok --ozdenetim | tee katman.log
          grep -q "ciziliyor=True" katman.log
      - name: Paketin içinde ekran yazısı okuma çalışıyor mu
        shell: bash
        run: ./dist/AltYaziKoprusu/AltYaziKoprusu.exe --ozdenetim
      - name: Paketin içinde çevrimdışı çeviri çalışıyor mu (en->tr dil dosyasını indirir)
        shell: bash
        run: |
          ./dist/AltYaziKoprusu/AltYaziKoprusu.exe --ozdenetim-ceviri | tee ceviri.log
          grep -q "OZDENETIM ceviri=" ceviri.log
      - name: Paketin içinde PS5 gizli bağlantı yardımcısı çalışıyor mu
        shell: bash
        run: |
          ls -la dist/AltYaziKoprusu/_internal/uzaktan/
          ./dist/AltYaziKoprusu/_internal/uzaktan/ayk-uzaktan.exe --help
          ./dist/AltYaziKoprusu/AltYaziKoprusu.exe --ozdenetim-uzaktan | tee uzaktan.log
          grep -q "OZDENETIM uzaktan=tamam" uzaktan.log
      - name: Lisans dosyalarını ekle
        shell: pwsh
        run: Copy-Item LICENSE,NOTICE,README.md,GIZLILIK.md dist/AltYaziKoprusu/ -ErrorAction SilentlyContinue
      # ---- Velopack: yalnız değişen parçalar indirilir (delta) ----
      # Önemli: Velopack köküne (%LOCALAPPDATA%\AltYaziKoprusu.Program) kurulum/kaldırmada dokunulur; kullanıcı verisi
      # (ayarlar %APPDATA%\AltyaziKoprusu, dublaj paketi %LOCALAPPDATA%\AltYaziKoprusu\dublaj-ortami) bunun DIŞINDA kalır.
      - name: Velopack aracını kur (vpk, sürüm sabit)
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Önceki sürümü indir (delta üretimi için; ilk Velopack sürümünde yoktur)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/velopack | Out-Null
          vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel win --token "${{ secrets.GITHUB_TOKEN }}" --outputDir dist/velopack
          if ($LASTEXITCODE -ne 0) { Write-Host "Önceki Velopack sürümü yok (ilk Velopack sürümü ya da ağ): tam paket üretilecek."; $global:LASTEXITCODE = 0 }
          # Aynı numaralı paket zaten indiyse (yeniden çalıştırma) yeniden üretilebilsin
          Get-ChildItem dist/velopack -Filter "*-${{ steps.surum.outputs.surum }}-*.nupkg" -ErrorAction SilentlyContinue | Remove-Item -Force
          Get-ChildItem dist/velopack | Select-Object Name, Length
      - name: Velopack paketini üret (tam + delta + Setup + taşınabilir)
        shell: pwsh
        run: |
          vpk pack --packId AltYaziKoprusu.Program --packVersion "${{ steps.surum.outputs.surum }}" `
            --packDir dist/AltYaziKoprusu --mainExe AltYaziKoprusu.exe `
            --packTitle "AltYazıKöprüsü" --packAuthors "AltYazıKöprüsü katkıcıları" `
            --icon paketleme/simge/uygulama.ico --channel win --delta BestSpeed `
            --releaseNotes SURUMLER.md --outputDir dist/velopack
          if ($LASTEXITCODE -ne 0) { throw "vpk pack başarısız." }
          Get-ChildItem dist/velopack | Select-Object Name, Length
      - name: Velopack kurulumu çalışıyor mu (tanı; kurulur, açılış sınanır)
        continue-on-error: true
        shell: bash
        run: |
          ./dist/velopack/AltYaziKoprusu.Program-win-Setup.exe --silent || true
          sleep 20
          exe="$LOCALAPPDATA/AltYaziKoprusu.Program/current/AltYaziKoprusu.exe"
          ls -la "$LOCALAPPDATA/AltYaziKoprusu.Program" "$LOCALAPPDATA/AltYaziKoprusu.Program/current" | head -30
          taskkill //IM AltYaziKoprusu.exe //F || true
          "$exe" --ozdenetim
      - name: Inno Setup kur (yalnız eski Inno kurulumlarından geçiş kurucusu için)
        run: choco install innosetup -y --no-progress
      - name: Geçiş kurucusunu üret (eski sürümlerin güncelleyicisi bu dosyayı arar)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $setup = (Resolve-Path dist/velopack/AltYaziKoprusu.Program-win-Setup.exe).Path
          & $iscc "/DSurum=${{ steps.surum.outputs.surum }}" "/DVelopackKurucu=$setup" paketleme\windows\gecis.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup (geçiş kurucusu) derlemesi başarısız." }
      - name: Sürüm dosyalarını hazırla (Velopack paketleri, kurucu, taşınabilir zip, SHA256SUMS.txt)
        shell: pwsh
        run: |
          $v = '${{ steps.surum.outputs.surum }}'
          New-Item -ItemType Directory -Force dist/yayin | Out-Null
          # Yalnız BU sürümün Velopack dosyaları yüklenir (önceki sürümler kendi Sürümlerinde zaten durur)
          Copy-Item "dist/velopack/AltYaziKoprusu.Program-$v-full.nupkg" dist/yayin/
          Copy-Item "dist/velopack/AltYaziKoprusu.Program-$v-delta.nupkg" dist/yayin/ -ErrorAction SilentlyContinue
          Copy-Item dist/velopack/releases.win.json, dist/velopack/RELEASES, dist/velopack/assets.win.json dist/yayin/ -ErrorAction SilentlyContinue
          # İnsanlar için adlar: yeni kurulum = AltYaziKoprusu-Windows-Kur.exe; taşınabilir zip
          Copy-Item dist/velopack/AltYaziKoprusu.Program-win-Setup.exe dist/yayin/AltYaziKoprusu-Windows-Kur.exe
          Copy-Item dist/velopack/AltYaziKoprusu.Program-win-Portable.zip "dist/yayin/AltYaziKoprusu-Tasinabilir-$v.zip"
          # Eski (Inno) kurulumlar bu adı arar: AltYaziKoprusu-Kur-<sürüm>.exe -> Velopack'a bir kerelik geçiş
          Copy-Item "dist/kurulum/AltYaziKoprusu-Kur-$v.exe" dist/yayin/
          # sha256sum biçimi: "<küçük harfli özet>  <dosya adı>" (eski güncelleyici bu dosyayı okur)
          $satirlar = Get-ChildItem dist/yayin -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/yayin/SHA256SUMS.txt'), (($satirlar -join "`n") + "`n"), (New-Object Text.UTF8Encoding($false)))
          Get-Content dist/yayin/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AltYaziKoprusu-Windows
          path: dist/yayin/*

  yayinla:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: paket
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: SURUMLER.md
      - uses: actions/download-artifact@v4
        with:
          name: AltYaziKoprusu-Windows
          path: yayin
      - name: GitHub Sürümünü oluştur
        uses: softprops/action-gh-release@v2.2.2
        with:
          files: |
            yayin/AltYaziKoprusu.Program-*-full.nupkg
            yayin/AltYaziKoprusu.Program-*-delta.nupkg
            yayin/releases.win.json
            yayin/RELEASES
            yayin/assets.win.json
            yayin/AltYaziKoprusu-Windows-Kur.exe
            yayin/AltYaziKoprusu-Kur-*.exe
            yayin/AltYaziKoprusu-Tasinabilir-*.zip
            yayin/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: SURUMLER.md
          prerelease: ${{ contains(github.ref_name, '-') }}
